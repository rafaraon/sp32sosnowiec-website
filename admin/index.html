<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Admina — SP32</title>
<link rel="stylesheet" href="/admin/_shared.css">
</head>
<body x-data="dashApp()" x-init="init()">
<div id="sidebar">
  <div class="brand"><span>SP32 Panel</span><small x-text="user.role === 'admin' ? 'Administrator' : 'Redaktor'"></small></div>
  <nav>
    <a href="/admin/index.html" class="active">📊 Dashboard</a>
    <div class="nav-section">Treści</div>
    <a href="/admin/news/index.html">📰 Aktualności</a>
    <a href="/admin/gallery/index.html">🖼️ Galeria</a>
    <template x-if="user.role === 'admin'">
      <div>
        <div class="nav-section">Admin</div>
        <a href="/admin/documents/index.html" class="admin-only">📄 Dokumenty</a>
        <a href="/admin/documents/index.html?tab=zfss" class="admin-only">🏦 ZFŚS</a>
        <a href="/admin/specialists/index.html" class="admin-only">👥 Specjaliści</a>
        <a href="/admin/menu/index.html" class="admin-only">🍽️ Jadłospis</a>
        <a href="/admin/rodo/index.html" class="admin-only">🔐 RODO</a>
        <a href="/admin/users/index.html" class="admin-only">🧑‍💼 Użytkownicy</a>
      </div>
    </template>
  </nav>
  <div class="sidebar-footer" x-text="user.email || 'Ładowanie...'"></div>
</div>
<div id="main">
  <div id="topbar">
    <h1>Dashboard</h1>
    <div style="display:flex;gap:.5rem;align-items:center">
      <span class="user-pill" x-text="user.email"></span>
      <template x-if="user.role === 'admin'">
        <button class="btn btn-outline btn-sm" @click="purgeCache()" :disabled="purging"
          x-text="purging ? 'Czyszczenie...' : '🔄 Wyczyść cache'"
          title="Wyczyść cache CDN — zmiany pojawią się natychmiast na stronie"></button>
      </template>
    </div>
  </div>
  <div id="content">
    <template x-if="loading"><div class="skel" style="height:200px;border-radius:8px"></div></template>
    <template x-if="purgeMsg">
      <div class="alert" :class="purgeOk ? 'alert-ok' : 'alert-error'" style="margin-bottom:.75rem"
        x-text="purgeMsg"></div>
    </template>
    <template x-if="!loading">
      <div>
        <div class="stat-grid">
          <div class="stat-card"><div class="stat-value" x-text="stats.news"></div><div class="stat-label">Aktualności</div></div>
          <div class="stat-card"><div class="stat-value" x-text="stats.albums"></div><div class="stat-label">Albumy</div></div>
          <div class="stat-card"><div class="stat-value" x-text="stats.documents"></div><div class="stat-label">Dokumenty</div></div>
          <div class="stat-card"><div class="stat-value" x-text="stats.rodo_pending"></div><div class="stat-label">Wnioski RODO</div></div>
        </div>
        <template x-if="rodoAlerts.length > 0">
          <div class="alert alert-warn">
            ⚠️ <strong x-text="rodoAlerts.length"></strong> albumów wymaga przeglądu RODO →
            <a href="/admin/rodo/index.html" style="font-weight:700">Przejdź do RODO</a>
          </div>
        </template>

        <!-- Storage widget -->
        <div style="margin-top:1.5rem;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.1rem 1.25rem">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem">
            <span style="font-weight:700;font-size:.92rem">💾 Przestrzeń dyskowa (R2)</span>
            <button @click="loadStorage()" :disabled="storageLoading"
              style="font-size:.75rem;color:var(--cp);background:none;border:none;cursor:pointer;padding:0"
              x-text="storageLoading ? 'Ładowanie…' : '↻ Odśwież'"></button>
          </div>
          <template x-if="!storageLoaded && !storageLoading">
            <button @click="loadStorage()"
              style="font-size:.82rem;color:var(--cp);background:var(--clv-l);border:1px solid var(--bd);border-radius:6px;padding:.35rem .8rem;cursor:pointer">
              Sprawdź zajętość
            </button>
          </template>
          <template x-if="storageLoading">
            <div style="font-size:.82rem;color:var(--tx-m)">Trwa liczenie plików w R2…</div>
          </template>
          <template x-if="storageLoaded && !storageLoading">
            <div>
              <div style="display:flex;align-items:baseline;gap:.4rem;margin-bottom:.5rem">
                <span style="font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums" x-text="storageUsedLabel"></span>
                <span style="font-size:.8rem;color:var(--tx-m)" x-text="'z ' + storageLimitLabel + ' (' + storagePct + '%)'"></span>
              </div>
              <div style="background:var(--clv);border-radius:4px;height:8px;overflow:hidden;margin-bottom:.65rem">
                <div :style="'width:'+storagePct+'%;background:'+storageBarColor+';height:100%;border-radius:4px;transition:width .4s ease'"></div>
              </div>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.4rem .8rem;font-size:.78rem;color:var(--tx-m)">
                <span>📁 <strong x-text="storageFiles"></strong> plików w R2</span>
                <span>🖼️ Zdjęcia: <strong x-text="storage.db.photos ?? '—'"></strong></span>
                <span>📰 Albumy: <strong x-text="storage.db.albums ?? '—'"></strong></span>
                <span>📄 Dokumenty: <strong x-text="storage.db.documents ?? '—'"></strong></span>
                <span>📰 Aktualności: <strong x-text="storage.db.news ?? '—'"></strong></span>
                <span>🍽️ Jadłospisy: <strong x-text="storage.db.menu_weeks ?? '—'"></strong></span>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>
</div>
<script src="/admin/_shared.js"></script>
<script src="/alpine.min.js" defer></script>
<script>
function dashApp() {
  return {
    user: { email: '', role: 'editor' },
    stats: { news: 0, albums: 0, documents: 0, rodo_pending: 0 },
    rodoAlerts: [],
    loading: true,
    purging: false,
    purgeMsg: '',
    purgeOk: false,
    storage: { bytes: 0, files: 0, db: {} },
    storageLoaded: false,
    storageLoading: false,
    STORAGE_LIMIT_BYTES: 10 * 1024 * 1024 * 1024, // 10 GB (R2 free tier)
    get storageUsedLabel() {
      const b = this.storage.bytes
      if (b >= 1024**3) return (b / 1024**3).toFixed(2) + ' GB'
      if (b >= 1024**2) return (b / 1024**2).toFixed(1) + ' MB'
      return (b / 1024).toFixed(0) + ' KB'
    },
    get storageLimitLabel() { return '10 GB' },
    get storageFiles() { return this.storage.files.toLocaleString('pl-PL') },
    get storagePct() {
      return Math.min(100, (this.storage.bytes / this.STORAGE_LIMIT_BYTES * 100)).toFixed(1)
    },
    get storageBarColor() {
      const p = this.storage.bytes / this.STORAGE_LIMIT_BYTES * 100
      return p > 80 ? '#DC2626' : p > 60 ? '#CA8A04' : '#16A34A'
    },

    async init() {
      try {
        const me = await API.get('/me')
        this.user = me
        const isAdmin = me.role === 'admin'
        const [newsData, albumsData, docsData, rodoData, auditData] = await Promise.all([
          API.get('/news').catch(() => ({ items: [] })),
          API.get('/gallery/albums').catch(() => ({ albums: [] })),
          isAdmin ? API.get('/documents?category=dokumenty').catch(() => ({ documents: [] })) : Promise.resolve({ documents: [] }),
          isAdmin ? API.get('/rodo/requests?status=pending').catch(() => ({ requests: [] })) : Promise.resolve({ requests: [] }),
          isAdmin ? API.get('/rodo/audit').catch(() => ({ albums: [] })) : Promise.resolve({ albums: [] }),
        ])
        this.stats.news = newsData.items?.length ?? 0
        this.stats.albums = albumsData.albums?.length ?? 0
        this.stats.documents = docsData.documents?.length ?? 0
        this.stats.rodo_pending = rodoData.requests?.length ?? 0
        this.rodoAlerts = auditData.albums ?? []
      } catch(e) { console.error(e) }
      finally { this.loading = false }
    },

    async loadStorage() {
      this.storageLoading = true
      try {
        const d = await API.get('/stats/storage')
        this.storage = d
        this.storageLoaded = true
      } catch(e) { console.error('storage stats error', e) }
      finally { this.storageLoading = false }
    },

    async purgeCache() {
      this.purging = true; this.purgeMsg = ''; this.purgeOk = false
      try {
        const r = await API.post('/cache/purge', {})
        this.purgeMsg = r.message ?? 'Cache wyczyszczony.'
        this.purgeOk = true
      } catch(e) {
        this.purgeMsg = e.message?.includes('setup_needed') || e.message?.includes('503')
          ? 'Brak konfiguracji: dodaj CF_ZONE_ID i CF_PURGE_TOKEN w ustawieniach Workera.'
          : (e.message ?? 'Błąd podczas czyszczenia cache.')
        this.purgeOk = false
      }
      this.purging = false
      setTimeout(() => { this.purgeMsg = '' }, 6000)
    }
  }
}
</script>
</body>
</html>
