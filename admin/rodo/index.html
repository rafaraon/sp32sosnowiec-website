<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RODO — Panel SP32</title>
<link rel="stylesheet" href="/admin/_shared.css">
<style>
.section-title { font-size: .85rem; font-weight: 700; color: #444; margin-bottom: 1rem; padding-bottom: .5rem; border-bottom: 1px solid #e8e8e8 }
.filter-bar { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap }
.filter-btn { padding: .3rem .75rem; font-size: .78rem; font-weight: 700; border-radius: 999px; border: 1px solid #d0d0d0; background: #fff; cursor: pointer }
.filter-btn.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e }

/* Request detail card */
.req-card { border: 1px solid #e8e8e8; border-radius: 10px; margin-bottom: 1rem; overflow: hidden }
.req-card-head { display: flex; align-items: center; gap: .75rem; padding: .85rem 1rem; background: #fafafa; flex-wrap: wrap }
.req-ref { font-family: monospace; font-size: .78rem; font-weight: 800; color: #1a1a2e; background: #e8e8ff; padding: .2rem .5rem; border-radius: 4px }
.req-student { font-weight: 700; font-size: .92rem; color: #1a1a2e }
.req-meta { font-size: .75rem; color: #888; margin-left: auto }
.req-card-body { padding: 1rem; display: grid; grid-template-columns: 1fr 1fr; gap: .85rem }
@media(max-width:600px){ .req-card-body { grid-template-columns: 1fr } }
.req-field { font-size: .78rem }
.req-field .lbl { color: #999; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .68rem; display: block; margin-bottom: .2rem }
.req-field .val { color: #222; line-height: 1.5 }

.albums-list { display: flex; flex-direction: column; gap: .35rem; margin-top: .3rem }
.album-link { display: inline-flex; align-items: center; gap: .4rem; font-size: .78rem; font-weight: 600;
  color: #1a1a2e; background: #f0f4ff; border: 1px solid #c8d4f8; border-radius: 5px; padding: .25rem .6rem; text-decoration: none }
.album-link:hover { background: #1a1a2e; color: #fff; border-color: #1a1a2e }

.req-card-foot { padding: .75rem 1rem; border-top: 1px solid #f0f0f0; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center }
.btn-xs { padding: .3rem .7rem; font-size: .75rem; border-radius: 6px; border: 1px solid #d0d0d0; background: #fff; cursor: pointer; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: .3rem }
.btn-xs:hover { background: #1a1a2e; color: #fff; border-color: #1a1a2e }
.btn-xs.success { background: #166534; color: #fff; border-color: #166534 }
.btn-xs.danger { border-color: #fca5a5 }
.btn-xs.danger:hover { background: #c0392b; border-color: #c0392b; color: #fff }

.director-badge { display: inline-flex; align-items: center; gap: .3rem; font-size: .72rem; font-weight: 700;
  background: #dcfce7; color: #166534; border: 1px solid #86efac; border-radius: 4px; padding: .2rem .5rem }

.submitter-badge { font-size: .7rem; font-weight: 700; padding: .15rem .45rem; border-radius: 3px }
.sub-parent { background: #eff6ff; color: #1d4ed8 }
.sub-student { background: #fef9c3; color: #854d0e }
.sub-adult { background: #f0fdf4; color: #166534 }
</style>
</head>
<body x-data="rodoAdmin()" x-init="init()">
<div id="sidebar">
  <div class="brand"><span>SP32 Panel</span><small x-text="role === 'admin' ? 'Administrator' : 'Redaktor'"></small></div>
  <nav>
    <a href="/admin/index.html">📊 Dashboard</a>
    <div class="nav-section">Treści</div>
    <a href="/admin/news/index.html">📰 Aktualności</a>
    <a href="/admin/gallery/index.html">🖼️ Galeria</a>
    <template x-if="role === 'admin'">
      <div>
        <div class="nav-section">Admin</div>
        <a href="/admin/documents/index.html" class="admin-only">📄 Dokumenty</a>
        <a href="/admin/specialists/index.html" class="admin-only">👥 Specjaliści</a>
        <a href="/admin/menu/index.html" class="admin-only">🍽️ Jadłospis</a>
        <a href="/admin/rodo/index.html" class="active admin-only">🔐 RODO</a>
        <a href="/admin/users/index.html" class="admin-only">🧑‍💼 Użytkownicy</a>
      </div>
    </template>
  </nav>
  <div class="sidebar-footer" x-text="userEmail"></div>
</div>

<div id="main">
  <div id="topbar">
    <h1>RODO — wnioski</h1>
    <div style="display:flex;gap:.5rem">
      <a href="/rodo-wniosek.html" target="_blank" class="btn btn-outline btn-sm">🔗 Formularz publiczny</a>
      <button class="btn btn-primary" @click="openDrawer()">+ Wniosek ręczny</button>
    </div>
  </div>
  <div id="content">
    <template x-if="role !== 'admin' && !loading">
      <div class="alert alert-warn">Brak dostępu — tylko Administrator</div>
    </template>
    <template x-if="role === 'admin'">
      <div>

        <!-- How to handle photos info -->
        <div class="alert" style="background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a5f;margin-bottom:1.25rem;font-size:.82rem;line-height:1.7">
          <strong>Jak usunąć / anonimizować zdjęcie?</strong><br>
          Kliknij link albumu poniżej → przejdź do galerii admin → znajdź ucznia na zdjęciu →
          użyj <strong>„Anonimizuj"</strong> (ukrywa z publicznej galerii) lub <strong>„Usuń"</strong> (trwale usuwa z serwera).<br>
          Dla zdjęć grupowych: „Anonimizuj" jest wystarczające — zdjęcie znika ze strony, pozostaje w archiwum.
          Jeśli wymagane fizyczne zamazanie twarzy: pobierz → edytuj → wgraj ponownie.
        </div>

        <!-- Wnioski -->
        <div class="card">
          <div class="section-title">Wnioski RODO</div>
          <div class="filter-bar">
            <button class="filter-btn" :class="{active: statusFilter === ''}" @click="setFilter('')">Wszystkie (<span x-text="requests.length"></span>)</button>
            <button class="filter-btn" :class="{active: statusFilter === 'pending'}" @click="setFilter('pending')">Oczekujące</button>
            <button class="filter-btn" :class="{active: statusFilter === 'in_progress'}" @click="setFilter('in_progress')">W toku</button>
            <button class="filter-btn" :class="{active: statusFilter === 'resolved'}" @click="setFilter('resolved')">Rozwiązane</button>
          </div>

          <template x-if="loadingRequests"><div class="skel" style="height:120px;border-radius:8px"></div></template>
          <template x-if="!loadingRequests && requests.length === 0">
            <p style="color:#999;font-size:.85rem;text-align:center;padding:2rem">Brak wniosków</p>
          </template>

          <template x-for="req in requests" :key="req.id">
            <div class="req-card">
              <div class="req-card-head">
                <span class="req-ref" x-text="req.reference_number ?? '—'"></span>
                <span class="req-student" x-text="req.student_name"></span>
                <span class="badge" :class="req.request_type === 'deletion' ? 'badge-red' : 'badge-yellow'"
                  x-text="req.request_type === 'deletion' ? '🗑️ Usunięcie' : '✋ Wycofanie'"></span>
                <span class="badge" :class="statusBadge(req.status)" x-text="statusLabel(req.status)"></span>
                <template x-if="req.director_approved_at">
                  <span class="director-badge">✓ Zatw. dyrektor</span>
                </template>
                <span class="req-meta" x-text="fmtDate(req.requested_at)"></span>
              </div>

              <div class="req-card-body">
                <div class="req-field">
                  <span class="lbl">Uczeń / klasa / rok szkolny</span>
                  <span class="val">
                    <strong x-text="req.student_name"></strong><br>
                    <span x-text="(req.class_label ?? '—') + ' · ' + (req.school_year_label ?? '')"></span>
                  </span>
                </div>
                <div class="req-field">
                  <span class="lbl">Zgłaszający</span>
                  <span class="val">
                    <span class="submitter-badge" :class="submitterClass(req.submitter_type)"
                      x-text="submitterLabel(req.submitter_type)"></span>
                    <template x-if="req.submitter_email">
                      <a :href="'mailto:' + req.submitter_email" style="display:block;font-size:.78rem;margin-top:.2rem;color:#1a1a2e" x-text="req.submitter_email"></a>
                    </template>
                  </span>
                </div>
                <div class="req-field" x-show="req.notes">
                  <span class="lbl">Uwagi zgłaszającego</span>
                  <span class="val" x-text="req.notes"></span>
                </div>
                <div class="req-field">
                  <span class="lbl">Pasujące albumy (<span x-text="albumList(req).length"></span>)</span>
                  <span class="val">
                    <template x-if="albumList(req).length === 0">
                      <span style="color:#999;font-size:.78rem">Nie znaleziono — sprawdź ręcznie w galerii</span>
                    </template>
                    <div class="albums-list">
                      <template x-for="album in albumList(req)" :key="album.id">
                        <a class="album-link" :href="'/admin/gallery/index.html#album=' + album.slug" target="_blank">
                          🖼️ <span x-text="album.title"></span>
                        </a>
                      </template>
                    </div>
                  </span>
                </div>
              </div>

              <div class="req-card-foot">
                <!-- Status change -->
                <select class="form-input" style="width:auto;padding:.25rem .5rem;font-size:.78rem"
                  :value="req.status" @change="changeStatus(req, $event.target.value)">
                  <option value="pending">Oczekujący</option>
                  <option value="in_progress">W toku</option>
                  <option value="resolved">Rozwiązany ✓</option>
                </select>

                <!-- Director approval (deletion only) -->
                <template x-if="req.request_type === 'deletion' && !req.director_approved_at">
                  <a class="btn-xs" :href="directorMailto(req)" title="Otwórz email do dyrektora">
                    📧 Wyślij do dyrektora
                  </a>
                </template>
                <template x-if="req.request_type === 'deletion' && !req.director_approved_at">
                  <button class="btn-xs success" @click="markDirectorApproved(req)">✓ Zatwierdzono przez dyrektora</button>
                </template>
                <template x-if="req.request_type === 'deletion' && req.director_approved_at">
                  <span style="font-size:.72rem;color:#166534">Dyrektor zatwierdził <span x-text="fmtDate(req.director_approved_at)"></span></span>
                </template>
              </div>
            </div>
          </template>
        </div>

        <!-- Audit section -->
        <div class="card">
          <div class="section-title">Audit automatyczny — albumy do przeglądu RODO</div>
          <template x-if="loadingAudit"><div class="skel" style="height:80px;border-radius:8px"></div></template>
          <template x-if="!loadingAudit && auditAlbums.length === 0">
            <p style="color:#888;font-size:.82rem">Brak albumów wymagających przeglądu w roku <strong x-text="currentYear"></strong>.</p>
          </template>
          <template x-if="!loadingAudit && auditAlbums.length > 0">
            <div style="overflow-x:auto">
              <table class="data-table">
                <thead><tr><th>Album</th><th>Rocznik ukończenia</th><th>Typ audytu</th><th></th></tr></thead>
                <tbody>
                  <template x-for="album in auditAlbums" :key="album.id">
                    <tr>
                      <td style="font-weight:600" x-text="album.title"></td>
                      <td x-text="album.graduation_year"></td>
                      <td>
                        <span class="badge" :class="album.audit_type === 'autonomy' ? 'badge-red' : 'badge-yellow'"
                          x-text="album.audit_type === 'autonomy' ? 'Autonomia (pełnoletni)' : 'Retencja (opuścili szkołę)'"></span>
                      </td>
                      <td>
                        <a href="/admin/gallery/index.html" class="btn btn-outline btn-sm" style="font-size:.72rem">Otwórz galerię →</a>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
        </div>

      </div>
    </template>
  </div>
</div>

<!-- Manual request drawer -->
<div class="drawer-overlay" :class="{open: drawerOpen}" @click="closeDrawer()"></div>
<div class="drawer" :class="{open: drawerOpen}">
  <div class="drawer-header">
    <h2>Nowy wniosek RODO (ręczny)</h2>
    <button class="btn btn-outline btn-sm" @click="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body">
    <div class="form-group">
      <label class="form-label">Imię i nazwisko ucznia *</label>
      <input class="form-input" x-model="newReq.student_name" placeholder="Jan Kowalski">
    </div>
    <div class="form-group">
      <label class="form-label">Klasa</label>
      <input class="form-input" x-model="newReq.class_label" placeholder="np. 8a">
    </div>
    <div class="form-group">
      <label class="form-label">Rok ukończenia szkoły</label>
      <input class="form-input" type="number" x-model.number="newReq.graduation_year" placeholder="np. 2024" min="2000" max="2040">
    </div>
    <div class="form-group">
      <label class="form-label">Typ wniosku *</label>
      <select class="form-input" x-model="newReq.request_type">
        <option value="withdrawal">Wycofanie zgody</option>
        <option value="deletion">Usunięcie danych</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Uwagi</label>
      <textarea class="form-input" x-model="newReq.notes" rows="3"></textarea>
    </div>
    <div x-show="createError" class="alert alert-error" x-text="createError"></div>
  </div>
  <div class="drawer-footer">
    <button class="btn btn-outline" @click="closeDrawer()">Anuluj</button>
    <button class="btn btn-primary" @click="createRequest()" :disabled="creating" x-text="creating ? 'Zapisywanie...' : 'Zapisz wniosek'"></button>
  </div>
</div>

<script src="/admin/_shared.js"></script>
<script src="/alpine.min.js" defer></script>
<script>
const DIRECTOR_EMAIL = 'dyrektor@sp32sosnowiec.edu.pl'

function rodoAdmin() {
  return {
    requests: [], auditAlbums: [], currentYear: new Date().getFullYear(),
    loadingRequests: true, loadingAudit: true, loading: true,
    statusFilter: '',
    userEmail: '', role: 'editor',
    drawerOpen: false,
    newReq: { student_name: '', class_label: '', graduation_year: null, request_type: 'withdrawal', notes: '' },
    creating: false, createError: '',

    async init() {
      try { const me = await API.get('/me'); this.userEmail = me.email; this.role = me.role } catch {}
      this.loading = false
      await Promise.all([this.loadRequests(), this.loadAudit()])
    },

    async loadRequests() {
      this.loadingRequests = true
      try {
        const path = this.statusFilter ? '/rodo/requests?status=' + this.statusFilter : '/rodo/requests'
        const d = await API.get(path)
        this.requests = (d.requests ?? []).map(r => ({ ...r, _parsedAlbums: null }))
      } catch {}
      finally { this.loadingRequests = false }
    },

    async loadAudit() {
      this.loadingAudit = true
      try {
        const d = await API.get('/rodo/audit')
        this.auditAlbums = d.albums ?? []
        this.currentYear = d.current_year ?? new Date().getFullYear()
      } catch {}
      finally { this.loadingAudit = false }
    },

    async setFilter(status) {
      this.statusFilter = status
      await this.loadRequests()
    },

    albumList(req) {
      if (req._parsedAlbums) return req._parsedAlbums
      try { req._parsedAlbums = JSON.parse(req.matched_albums || '[]') } catch { req._parsedAlbums = [] }
      return req._parsedAlbums
    },

    async changeStatus(req, newStatus) {
      try {
        await API.put('/rodo/requests/' + req.id, { status: newStatus })
        req.status = newStatus
        if (newStatus === 'resolved') req.resolved_at = new Date().toISOString()
      } catch(e) { alert(e.message) }
    },

    async markDirectorApproved(req) {
      if (!confirm('Oznaczyć wniosek jako zatwierdzony przez dyrektora?')) return
      try {
        await API.put('/rodo/requests/' + req.id, { director_approved: true })
        req.director_approved_at = new Date().toISOString()
      } catch(e) { alert(e.message) }
    },

    directorMailto(req) {
      const albums = this.albumList(req)
      const albumLines = albums.length
        ? albums.map(a => '  - ' + a.title + ' (/admin/gallery/index.html#album=' + a.slug + ')').join('\n')
        : '  (nie znaleziono automatycznie — proszę sprawdzić ręcznie)'
      const body = encodeURIComponent(
        'Szanowna Pani Dyrektor,\n\n' +
        'Wpłynął wniosek RODO o usunięcie zdjęć ucznia.\n\n' +
        'Nr referencyjny: ' + (req.reference_number ?? '—') + '\n' +
        'Uczeń: ' + req.student_name + '\n' +
        'Klasa: ' + (req.class_label ?? '—') + '\n' +
        'Zgłaszający: ' + this.submitterLabel(req.submitter_type) + '\n' +
        (req.submitter_email ? 'E-mail zgłaszającego: ' + req.submitter_email + '\n' : '') +
        (req.notes ? 'Uwagi: ' + req.notes + '\n' : '') +
        '\nAlbumy z prawdopodobnie pasującymi zdjęciami:\n' + albumLines + '\n\n' +
        'Proszę o wyrażenie zgody na usunięcie zdjęć — wystarczy odpowiedź e-mailem.\n\n' +
        'Z poważaniem,\n' + this.userEmail
      )
      return 'mailto:' + DIRECTOR_EMAIL + '?subject=' + encodeURIComponent('Wniosek RODO ' + (req.reference_number ?? '')) + '&body=' + body
    },

    openDrawer() {
      this.newReq = { student_name: '', class_label: '', graduation_year: null, request_type: 'withdrawal', notes: '' }
      this.createError = ''; this.drawerOpen = true
    },
    closeDrawer() { this.drawerOpen = false },

    async createRequest() {
      if (!this.newReq.student_name || !this.newReq.request_type) {
        this.createError = 'Imię i nazwisko oraz typ wniosku są wymagane'; return
      }
      this.creating = true; this.createError = ''
      try {
        await API.post('/rodo/requests', {
          student_name: this.newReq.student_name,
          class_label: this.newReq.class_label || null,
          graduation_year: this.newReq.graduation_year || null,
          request_type: this.newReq.request_type,
          notes: this.newReq.notes || null
        })
        this.closeDrawer(); await this.loadRequests()
      } catch(e) { this.createError = e.message }
      finally { this.creating = false }
    },

    statusLabel(s) { return { pending: 'Oczekujący', in_progress: 'W toku', resolved: 'Rozwiązany' }[s] ?? s },
    statusBadge(s) { return { pending: 'badge-yellow', in_progress: 'badge-gray', resolved: 'badge-green' }[s] ?? 'badge-gray' },
    submitterLabel(t) { return { parent: 'Rodzic', student: 'Uczeń 13+', adult: 'Pełnoletni były uczeń' }[t] ?? '—' },
    submitterClass(t) { return { parent: 'submitter-badge sub-parent', student: 'submitter-badge sub-student', adult: 'submitter-badge sub-adult' }[t] ?? '' },
    fmtDate
  }
}
</script>
</body>
</html>
