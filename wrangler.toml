name = "sp32sosnowiec"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "sp32-db"
database_id = "6d53c13a-f432-4deb-aa98-fe7186261c9c"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sp32-media"

[vars]
ADMIN_EMAIL = "sp32.tech@gmail.com"
MEDIA_PUBLIC_URL = "https://pub.sp32sosnowiec.edu.pl"
CF_ACCESS_TEAM_DOMAIN = "late-mud-7745.cloudflareaccess.com"
EMAIL_FROM = "SP32 Sosnowiec <rodo@sp32sosnowiec.edu.pl>"

# Required secrets (set via: npx wrangler secret put <NAME>)
# ADMIN_SECRET   — used by DEV_MODE bypass (X-Admin-Secret header)
# CF_ZONE_ID     — optional, for cache purge after content changes
# CF_PURGE_TOKEN — optional, paired with CF_ZONE_ID
# RESEND_API_KEY — optional, enables email notifications (get at resend.com)

